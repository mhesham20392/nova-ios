<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA Engineering</title>
<meta name="theme-color" content="#24306a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOVA">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --navy:#24306a; --navy-2:#1a2350; --gold:#c8a75e; --gold-soft:#f4ecd9;
  --bg:#f4f5f9; --card:#ffffff; --ink:#151a2e; --muted:#5d6480; --line:#e3e6ef;
  --chip:#eceef6; --shadow:0 1px 2px rgba(20,28,60,.06),0 4px 14px rgba(20,28,60,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1220; --card:#181c2e; --ink:#eef0f7; --muted:#a4aac2; --line:#2a2f47;
    --chip:#22273d; --gold-soft:#2c2718; --shadow:none;
  }
}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c2e;--ink:#eef0f7;--muted:#a4aac2;--line:#2a2f47;--chip:#22273d;--gold-soft:#2c2718;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
h1,h2,h3{margin:0;line-height:1.25}

/* app bar */
.bar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;min-height:58px}
.bar .back{width:38px;height:38px;border-radius:50%;display:none;align-items:center;justify-content:center;margin-left:-6px}
.bar .back:active{background:rgba(255,255,255,.12)}
.bar.sub .back{display:flex}
.bar .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;font-size:17px}
.bar .brand small{display:block;font-size:9.5px;letter-spacing:.2em;color:var(--gold);font-weight:600;margin-top:-2px}
.bar .title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{width:30px;height:30px;border-radius:50%;border:3px solid var(--gold);border-right-color:transparent;transform:rotate(-30deg);flex:none}

main{padding:0 0 calc(84px + env(safe-area-inset-bottom));min-height:100vh}
.wrap{padding:16px}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:4px 0;font-weight:500}
nav.tabs a svg{width:24px;height:24px;padding:2px 12px;box-sizing:content-box;border-radius:16px}
nav.tabs a.on{color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs a.on{color:var(--gold)}}
nav.tabs a.on svg{background:var(--gold-soft)}

/* hero */
.hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:22px 18px 26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-70px;top:-50px;width:230px;height:230px;border-radius:50%;
  border:14px solid var(--gold);border-right-color:transparent;opacity:.55;transform:rotate(-25deg)}
.hero .logoCard{background:#fff;border-radius:16px;padding:10px 14px;width:190px;position:relative;z-index:1}
.hero h1{font-size:23px;margin:18px 0 8px;font-weight:700;position:relative;z-index:1;max-width:320px}
.hero p{margin:0;color:#c9cfe6;font-size:14px;position:relative;z-index:1;max-width:340px}
.hero .cta{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font-weight:600;font-size:14.5px;border:0;cursor:pointer}
.btn.gold{background:var(--gold);color:#1a1a1a}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn.navy{background:var(--navy);color:#fff}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:-14px 16px 0;position:relative;z-index:2}
.stat{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat b{display:block;font-size:22px;color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat b{color:var(--gold)}}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.3;display:block}

.sec{margin:26px 16px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-h h2{font-size:18px}
.sec-h a{color:var(--gold);font-weight:600;font-size:13.5px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}

/* category grid */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:112px}
.cat:active{transform:scale(.98)}
.cat .ic{width:38px;height:38px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center}
.cat .ic svg{width:21px;height:21px}
.cat b{font-size:14px;line-height:1.3}
.cat span{font-size:12px;color:var(--muted);margin-top:auto}

/* logo strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.strip::-webkit-scrollbar{display:none}
.strip a{flex:none;width:120px;height:72px;background:#fff;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:10px}
.strip img{max-height:100%;object-fit:contain}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card + .card{margin-top:10px}
.card p{margin:0 0 10px;color:var(--ink)}
.card p:last-child{margin-bottom:0}
.muted{color:var(--muted)}

/* partners list */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{border:0;outline:0;background:transparent;font:inherit;color:var(--ink);width:100%;height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 4px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:500;color:var(--ink);border:1px solid transparent;cursor:pointer}
.chip.on{background:var(--navy);color:#fff}
.group-t{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:20px 0 8px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.prow:active{background:var(--chip)}
.prow .lg{width:84px;height:52px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:6px;flex:none;border:1px solid var(--line)}
.prow .lg img{max-height:100%;object-fit:contain}
.prow b{display:block;font-size:14.5px}
.prow span{font-size:12.5px;color:var(--muted)}
.prow .chev{margin-left:auto;color:var(--muted);flex:none}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* detail */
.dhero{background:#fff;border-bottom:1px solid var(--line)}
.dhero .photo{height:230px;display:flex;align-items:center;justify-content:center;padding:12px;background:#fff}
.dhero .photo img{max-height:100%;object-fit:contain}
.dhead{padding:16px;display:flex;gap:12px;align-items:center}
.dhead .lg{width:110px;height:64px;background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:8px;flex:none}
.dhead .lg img{max-height:100%;object-fit:contain}
.dhead h1{font-size:19px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;background:var(--chip);border-radius:6px;padding:3px 8px;color:var(--muted);font-weight:500}
.tag.g{background:var(--gold-soft);color:#8a6d2b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.g{color:var(--gold)}}
ul.ticks{list-style:none;margin:0;padding:0}
ul.ticks li{position:relative;padding:7px 0 7px 26px;border-bottom:1px solid var(--line)}
ul.ticks li:last-child{border-bottom:0}
ul.ticks li:before{content:"";position:absolute;left:4px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
ul.dots{margin:0;padding-left:18px}
ul.dots li{margin:4px 0}
.subh{font-weight:700;font-size:13.5px;color:var(--navy);margin:14px 0 4px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .subh{color:var(--gold)}}
.subh:first-child{margin-top:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}

/* company */
.photoCard{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.photoCard img{width:100%;height:190px;object-fit:cover}
.mv{display:grid;gap:10px}
.mv .card{border-left:4px solid var(--gold)}
.mv h3{font-size:16px;margin-bottom:6px;color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mv h3{color:var(--gold)}}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc .card{padding:14px}
.svc .card + .card{margin-top:0}
.svc b{display:block;font-size:14px;margin:8px 0 4px}
.svc p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.4}
.num{width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.teamgrid{display:grid;gap:10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pair img{border-radius:12px;height:110px;width:100%;object-fit:cover}
.partnerLogos{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.partnerLogos .lg{height:56px;flex:1;background:#fff;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:6px}
.partnerLogos .lg img{max-height:100%;object-fit:contain}

/* contact */
.clist{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.crow:active{background:var(--chip)}
.crow .ic{width:42px;height:42px;border-radius:12px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.crow .ic svg{width:21px;height:21px}
.crow small{display:block;color:var(--muted);font-size:12px}
.crow b{font-weight:600;font-size:14.5px;word-break:break-word}
.form label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px;font-weight:500}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px;font:inherit;outline:0}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--gold)}
.form textarea{min-height:110px;resize:vertical}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:26px 16px 0}

/* support */
.urgent{display:flex;align-items:center;gap:12px;background:#fdecec;border:1px solid #f3c4c4;color:#8f1d1d;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.urgent svg{width:22px;height:22px;flex:none}
.urgent b{display:block;font-size:14px}.urgent span{font-size:12.5px}
.fs-t{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:22px 0 2px;padding-top:16px;border-top:1px solid var(--line)}
.form .fs-t:first-child{margin-top:0;padding-top:0;border-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two>div{min-width:0}
.prio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;position:relative}
.pr b{display:block;font-size:14px;padding-left:16px}.pr span{font-size:12px;color:var(--muted)}
.pr:before{content:"";position:absolute;left:12px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--dot)}
.pr.on{border-color:var(--dot);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--dot) 18%,transparent)}
.pr-critical{--dot:#d93a3a}.pr-high{--dot:#e8892c}.pr-normal{--dot:#3a7bd5}.pr-low{--dot:#3aa66b}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photos:empty{display:none}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.addph{display:flex!important;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:12px;padding:14px;margin-top:8px!important;color:var(--ink)!important;font-weight:600;font-size:14px!important;cursor:pointer}
.addph[hidden]{display:none!important}
.addph svg{width:20px;height:20px;color:var(--gold)}
.form .bad{border-color:#d93a3a!important;background:#fdf3f3}
.err{background:#fdecec;color:#8f1d1d;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:14px}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--dot);flex:none;margin:0 4px 0 6px}
.tkrow b.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.pt{background:var(--dot);color:#fff}
.done-card{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;border-radius:16px;padding:22px 18px;text-align:center}
.done-card h2{font-size:19px;margin:12px 0 6px}.done-card p{margin:0;color:#d6dbef;font-size:14px}
.tick{width:56px;height:56px;border-radius:50%;background:var(--gold);color:#1a1a1a;display:flex;align-items:center;justify-content:center;margin:0 auto}
.tick svg{width:28px;height:28px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv span{color:var(--muted);flex:none}.kv b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}

/* header info */
.evBtn{margin-left:auto;position:relative;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border-radius:999px;color:#1a2350;flex:none;
  background:linear-gradient(110deg,#c8a75e 0%,#f1dca8 45%,#c8a75e 60%,#c8a75e 100%);background-size:250% 100%;animation:evShine 3s ease-in-out infinite;box-shadow:0 0 0 0 rgba(200,167,94,.6)}
.evBtn svg{animation:evRing 3s ease-in-out infinite;transform-origin:50% 10%}
.evBtn b{font-size:13px;font-weight:700}
.evBtn i{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:#ff5a5f;border:2px solid var(--navy);animation:evLive 1.6s infinite}
@keyframes evShine{0%{background-position:100% 0}60%,100%{background-position:-50% 0}}
@keyframes evRing{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-16deg)}72%{transform:rotate(14deg)}79%{transform:rotate(-10deg)}86%{transform:rotate(6deg)}}
.bar.sub .evBtn{display:none}
.bar.sub .infoBtn{margin-left:auto}
@media (prefers-reduced-motion: reduce){.evBtn,.evBtn svg,.evBtn i{animation:none}}
.infoBtn{margin-left:6px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.85;flex:none}
.infoBtn:active{background:rgba(255,255,255,.12)}
/* library */
.small{font-size:12px}
.ltag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tc,#5d6480);background:color-mix(in srgb,var(--tc,#5d6480) 12%,transparent);border-radius:6px;padding:3px 8px}
.lcard-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.lgrid{display:grid;gap:10px}
.lcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.lcard:active{background:var(--chip)}
.lcard b{display:block;font-size:15px;line-height:1.35;margin-top:8px}
.lcard p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.feat{display:block;margin-top:14px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--navy) 0%,#2f3d86 60%,var(--navy-2) 100%);color:#fff;position:relative}
.feat:after{content:"";position:absolute;right:-60px;bottom:-80px;width:200px;height:200px;border-radius:50%;border:12px solid var(--gold);border-left-color:transparent;opacity:.5}
.feat-in{padding:20px 18px;position:relative;z-index:1}
.feat .ltag{--tc:#e6cf93;background:rgba(230,207,147,.16)}
.feat h3{font-size:19px;margin:10px 0 6px;line-height:1.3}
.feat p{margin:0;color:#c9cfe6;font-size:13.5px}
.feat-cta{display:inline-flex;align-items:center;gap:4px;margin-top:14px;color:var(--gold);font-weight:600;font-size:13.5px}
.feat-cta svg{width:16px;height:16px}
.refgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.refc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-height:84px}
.refc b{font-size:14px;line-height:1.3}
.dic{width:40px;height:40px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.dic svg{width:20px;height:20px}
.prow.doc b{font-size:14px}
.prow.book{align-items:flex-start}
.prow.book p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.spine{width:8px;align-self:stretch;border-radius:3px;background:linear-gradient(var(--gold),#a8853d);flex:none}
.art-h{font-size:23px;line-height:1.25;margin:0 0 14px;text-wrap:balance}
.art{font-size:15px;line-height:1.65}
.art .lead{font-size:16px;color:var(--ink);border-left:3px solid var(--gold);padding-left:12px;margin:0 0 6px}
.art h3{font-size:17px;margin:22px 0 8px;color:var(--navy)}
.art p{margin:0 0 10px}
.art ul,.art ol{padding-left:20px;margin:0 0 10px}
.art li{margin:5px 0}
.art code{font-size:12.5px;background:var(--chip);padding:2px 6px;border-radius:5px;word-break:break-all}
.art .note{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.art .note a,.art a{color:var(--navy);font-weight:600;text-decoration:underline}
.tblwrap{overflow-x:auto;margin:0 0 12px}
.art>.tbl,.art .tbl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 12px;display:table}
.art>.tbl{display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--chip);font-weight:600;font-size:12px}
.tbl.tnum td{font-variant-numeric:tabular-nums;white-space:nowrap}
.gloss dt{font-weight:700;color:var(--navy);margin-top:10px}
.gloss dd{margin:2px 0 0;color:var(--ink);font-size:14px}
.srcs{list-style:none;padding:0;margin:0}
.srcs li{border-bottom:1px solid var(--line)}.srcs li:last-child{border:0}
.srcs a{display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-size:14px;font-weight:500}
.srcs svg{width:16px;height:16px;flex:none;color:var(--muted)}

/* URS builder */

/* ===== Proposal Desk ===== */
.qx{--qbg:#0b0f24;--qcard:rgba(255,255,255,.045);--qline:rgba(255,255,255,.1);--qtxt:#eef0f8;--qmut:#9aa3c4;--qgold:#c8a75e;--qgold2:#e6cf93;

.qpartners{display:flex;flex-direction:column;gap:8px}

.qfiles{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}.qfiles:empty{display:none}

.qf div{flex:1;min-width:0}.qf b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qf small{color:var(--qmut);font-size:11.5px}

.qurs{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.qursi{display:grid;grid-template-columns:1fr auto;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--qline);border-radius:12px;padding:10px 12px;color:var(--qtxt);font:inherit;cursor:pointer}
.qursi b{font-size:13.5px}.qursi small{color:var(--qmut);font-size:12px;grid-column:1}.qursi .qtick{grid-row:1/3;grid-column:2;align-self:center}

.qlab{display:block;font-size:12px;color:var(--qmut);margin:12px 0 4px}.qlab i{color:var(--qgold);font-style:normal}
.qin{width:100%;background:transparent;border:0;border-bottom:1px solid var(--qline);color:var(--qtxt);font:inherit;font-size:14.5px;padding:6px 0 8px;outline:0;resize:none;overflow:hidden;transition:border-color .2s}

.qform{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-bottom:12px}

.qcard{border:1px solid var(--qline);border-radius:18px;background:var(--qcard);padding:4px 14px}

.cg summary{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 0;cursor:pointer}
.cg summary::-webkit-details-marker{display:none}
.cg summary b{flex:1;font-size:14px}
.cg summary span{font-size:12px;color:var(--muted);background:var(--chip);border-radius:999px;padding:1px 8px}
.cg summary:after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 3px 2px;transition:transform .2s}
.cg[open] summary:after{transform:rotate(-135deg);margin-bottom:-3px}
.cgl{display:flex;flex-direction:column;gap:6px;padding-bottom:10px}
.ci{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.ci:active{background:var(--chip)}
.ci div{flex:1;min-width:0}
.ci b{display:block;font-size:13.5px;line-height:1.3}
.ci small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.ci svg{width:15px;height:15px;color:var(--muted);flex:none}

/* ===== Events ===== */
.evCta{position:relative;display:flex;align-items:center;gap:14px;margin:4px 16px 6px;padding:14px 14px 14px 12px;border-radius:20px;color:#fff;overflow:hidden;
  background:linear-gradient(120deg,#1a2350 0%,#24306a 55%,#3a2f6e 100%);box-shadow:0 10px 30px rgba(26,35,80,.35)}
.evCta:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(200,167,94,.55) 80%,transparent 90%);animation:evSweep 4.5s linear infinite}
.evCta:after{content:"";position:absolute;inset:2px;border-radius:18px;background:linear-gradient(120deg,#1a2350 0%,#24306a 55%,#33296a 100%)}
.evCta>*{position:relative;z-index:1}
@keyframes evSweep{to{transform:rotate(360deg)}}
.evIc{position:relative;width:58px;height:58px;flex:none}
.evIc .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);opacity:0;animation:evPulse 2.4s ease-out infinite}
.evIc .ring.r2{animation-delay:1.2s}
@keyframes evPulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.evCal span{display:block}.evCal{position:absolute;left:9px;top:8px;width:40px;height:42px;border-radius:9px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3);overflow:hidden;animation:evBob 3s ease-in-out infinite;perspective:120px}
@keyframes evBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-3px) rotate(4deg)}}
.evCal .top{height:12px;background:linear-gradient(90deg,#c8a75e,#e3c98c);font:700 7.5px/12px Roboto,sans-serif;color:#1a2350;text-align:center;letter-spacing:.08em}
.evCal .day{font:800 19px/28px Roboto,sans-serif;color:#1a2350;text-align:center}
.evCal .flip{position:absolute;left:0;right:0;top:12px;height:30px;background:#f4ecd9;transform-origin:top;animation:evFlip 3.6s ease-in-out infinite;backface-visibility:hidden}
@keyframes evFlip{0%,70%{transform:rotateX(90deg);opacity:0}78%{transform:rotateX(0);opacity:1}92%{transform:rotateX(-90deg);opacity:.6}100%{transform:rotateX(-90deg);opacity:0}}
.evIc .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:evTw 2s ease-in-out infinite}
.evIc .s1{right:2px;top:4px}.evIc .s2{left:0;bottom:8px;animation-delay:.7s;width:4px;height:4px}.evIc .s3{right:6px;bottom:0;animation-delay:1.3s;width:5px;height:5px}
@keyframes evTw{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
.evTxt{flex:1;min-width:0}
.evTxt small{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.evTxt small i{width:7px;height:7px;border-radius:50%;background:#ff5a5f;box-shadow:0 0 0 0 rgba(255,90,95,.7);animation:evLive 1.6s infinite}
@keyframes evLive{70%{box-shadow:0 0 0 7px rgba(255,90,95,0)}100%{box-shadow:0 0 0 0 rgba(255,90,95,0)}}
.evTxt b{display:block;font-size:16px;margin-top:2px}
.evTxt span{display:block;font-size:12.5px;color:#c9cfe6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evCd{flex:none;text-align:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:6px 9px}
.evCd b{display:block;font-size:20px;line-height:1;color:var(--gold)}.evCd span{font-size:10px;color:#c9cfe6;letter-spacing:.08em;text-transform:uppercase}
@media (prefers-reduced-motion: reduce){.evCta:before,.evIc *,.evTxt small i{animation:none!important}.evIc .ring{opacity:0}}

.evHero{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;padding:20px 16px 22px;position:relative;overflow:hidden}
.evHero:after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;border:24px solid rgba(200,167,94,.14)}
.evHero h1{font-size:24px;margin:4px 0 6px;position:relative}.evHero p{margin:0;color:#c9cfe6;font-size:14px;position:relative}
.evHero .btn{margin-top:14px;position:relative;background:#0a66c2;color:#fff}
.evNext{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.evDate{flex:none;align-self:flex-start;min-height:78px;width:62px;border-radius:14px;background:linear-gradient(160deg,var(--gold),#a88a45);color:#1a1a1a;text-align:center;padding:8px 4px;display:flex;flex-direction:column;justify-content:center}
.evDate small{font-size:11px;font-weight:700;letter-spacing:.1em}.evDate b{font-size:24px;line-height:1.1}.evDate span{font-size:10.5px;font-weight:600}
.evNext h3{margin:0 0 3px;font-size:16px}.evMeta{font-size:12.5px;color:var(--muted);display:flex;gap:5px;align-items:flex-start;margin-top:3px}.evMeta svg{width:14px;height:14px;flex:none;margin-top:2px}
.evTag{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-bottom:3px}
.evChip{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12px;font-weight:600;background:var(--gold-soft);color:#8a6d2c;border-radius:999px;padding:3px 10px}
.evChip svg{width:13px;height:13px}
.evAct{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.evAct a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:8px 4px;border-radius:12px;background:var(--chip);color:var(--ink);text-align:center}
.evAct svg{width:18px;height:18px;color:var(--navy)}
.evPast{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.evPast .ph{width:100%;height:170px;background:#1a2350 center/cover no-repeat;position:relative}
.evPast .ph.none{background:linear-gradient(135deg,#24306a,#1a2350);display:flex;align-items:center;justify-content:center;color:var(--gold);font:800 22px/1.15 Roboto,sans-serif;letter-spacing:.02em;text-align:center;padding:16px}
.evPast .ph em{position:absolute;left:12px;top:12px;font-style:normal;font-size:11px;font-weight:700;background:rgba(10,14,35,.75);color:#fff;border-radius:999px;padding:4px 10px}
.evPast .bd{padding:12px 14px 14px}.evPast h3{margin:0;font-size:16px}
.evLogos{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.evLogos img{height:26px;width:54px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:7px;padding:2px 4px}
.evGal{display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 12px}.evGal img{width:100%;border-radius:14px}

/* product detail */
.pdh{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:18px 16px 22px;position:relative;overflow:hidden}
.pdh:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:26px solid rgba(200,167,94,.13)}
.pdh .crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.7);position:relative;z-index:1}
.pdh .crumb img{width:44px;height:26px;object-fit:contain;background:#fff;border-radius:6px;padding:2px 4px}
.pdh .eyebrow{margin:14px 0 4px;position:relative;z-index:1}
.pdh h1{font-size:23px;line-height:1.2;margin:0;position:relative;z-index:1}
.pdh p{margin:8px 0 0;color:rgba(255,255,255,.82);font-size:14px;position:relative;z-index:1}
.pdph{background:#fff;border-bottom:1px solid var(--line);height:170px;display:flex;align-items:center;justify-content:center;padding:10px}
.pdph img{max-height:100%;max-width:100%;object-fit:contain}
.pdph.pdimg{height:260px;padding:0;background:#fff}.pdph.pdimg.dark{background:#141414}.pdph.pdimg img{height:100%;width:100%;object-fit:contain}
.ci .cith{width:46px;height:46px;border-radius:9px;object-fit:cover;flex:none;background:#fff;border:1px solid var(--line)}
.pdov{font-size:15px;line-height:1.6;margin:0}
.pdf{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.pdf li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px;line-height:1.4}
.pdf li i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700}
.pds{width:100%;border-collapse:collapse;font-size:13.5px}
.pds td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.pds tr:last-child td{border-bottom:0}
.pds td:first-child{color:var(--muted);width:44%;padding-right:12px}
.pds td:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.pda{display:flex;flex-wrap:wrap;gap:8px}
.pda span{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px}
.pdcta{background:linear-gradient(150deg,var(--navy),var(--navy-2));color:#fff;border-radius:18px;padding:18px;margin-top:14px}
.pdcta h3{margin:0 0 4px;font-size:17px}.pdcta p{margin:0 0 14px;color:rgba(255,255,255,.78);font-size:13.5px}
.pdcta .btn{width:100%;justify-content:center}
.pdcta .btn.gold{background:var(--gold);color:#1a1a1a}
.pdcta .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pdcta .row2 .btn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22)}
.pdnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.pdnav a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.pdnav a small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.pdnav a b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdnav a.r{text-align:right}
.pdnote{font-size:12px;color:var(--muted);margin:12px 2px 0}
.ttLines{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}
.ttLines button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center}
.ttLines button small{font-size:11px;color:var(--muted);font-weight:700}
.ttLines button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ttLines button.on small{color:var(--gold)}
.ttLines button.add{border-style:dashed;color:var(--navy)}
.ttHalf{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card);border-top:4px solid var(--navy)}
.ttHalf.agg{border-top-color:var(--gold)}
.ttHalfH{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.ttHalfH span{font-size:18px;color:var(--gold)}
.ttHalfH b{font-size:16px}
.ttHalfH small{margin-left:auto;color:var(--muted);font-size:12px}
.ttLvGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ttLvGrid button{text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;cursor:pointer;color:var(--ink);font:inherit;position:relative}
.ttLvGrid button b{display:block;font-size:14px}
.ttLvGrid button span{font-size:11.5px;color:var(--muted)}
.ttLvGrid button.on{border-color:var(--gold);background:var(--gold-soft)}
.ttLvGrid button.on:after{content:"✓";position:absolute;top:8px;right:10px;color:#2fa36b;font-weight:800}
.ttPoint{margin-top:10px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.ttSt{display:inline-block;font-size:10.5px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:1px 7px;margin-top:4px}
.ttMk .ttSt{display:table;margin-top:6px}
/* ---------- T&T whiteboard ---------- */
.wb{position:relative;margin:4px 0 0;border-radius:22px;overflow:hidden;background:#0b1028;border:1px solid rgba(231,196,114,.35);
  box-shadow:0 18px 50px rgba(8,12,40,.45),inset 0 1px 0 rgba(255,255,255,.06);transition:box-shadow .2s}
.wb.hot{box-shadow:0 0 0 3px #e7c472,0 18px 50px rgba(8,12,40,.45)}
.wb.full{position:fixed;inset:0;z-index:900;border-radius:0;margin:0}
.wbV{height:min(62vh,560px);overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  background:radial-gradient(1200px 500px at 20% -10%,rgba(200,167,94,.18),transparent 60%),radial-gradient(900px 600px at 110% 120%,rgba(70,120,255,.18),transparent 60%),#0b1028}
.wb.full .wbV{height:100vh}
.wbV::-webkit-scrollbar{display:none}
.wbC{position:relative}
.wbS{position:absolute;left:0;top:0;width:1700px;height:920px;transform-origin:0 0;
  background-image:radial-gradient(rgba(255,255,255,.13) 1.2px,transparent 1.3px);background-size:26px 26px}
.wbLane{position:absolute;left:0;right:0;pointer-events:auto}
.wbLane span{position:absolute;left:24px;top:14px;font:700 13px/1 Inter,system-ui,sans-serif;letter-spacing:.24em;color:rgba(231,196,114,.55)}
.wbLane.sw{top:30px;height:230px;border-top:1px dashed rgba(95,211,255,.18);border-bottom:1px dashed rgba(95,211,255,.18);background:linear-gradient(180deg,rgba(95,211,255,.05),transparent)}
.wbLane.sw span{color:rgba(95,211,255,.6)}
.wbLane.ln{top:310px;height:340px;background:linear-gradient(180deg,rgba(231,196,114,.05),transparent)}
.wbL{position:absolute;left:0;top:0;overflow:visible}
.wbL path{fill:none;stroke-width:4;cursor:pointer;pointer-events:stroke}
.wbL path.fw{stroke:url(#gF);stroke-dasharray:14 10;animation:wbFlow 1.2s linear infinite;filter:drop-shadow(0 0 6px rgba(231,196,114,.55))}
.wbL path.dt{stroke:#5fd3ff;stroke-width:2.5;stroke-dasharray:4 8;animation:wbFlow 1.6s linear infinite;filter:drop-shadow(0 0 5px rgba(95,211,255,.6))}
.wbL path.sel{stroke-width:7}
@keyframes wbFlow{to{stroke-dashoffset:-24}}
.wbN{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;color:#fff;font-family:Inter,system-ui,sans-serif;
  border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);transition:box-shadow .2s,transform .15s;animation:wbIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes wbIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.wbN.drag{cursor:grabbing;transform:scale(1.05);box-shadow:0 24px 50px rgba(0,0,0,.6),0 0 0 2px #e7c472;z-index:5;transition:none}
.wbN.sel{box-shadow:0 0 0 3px #e7c472,0 0 40px rgba(231,196,114,.55),0 14px 34px rgba(0,0,0,.45)}
.wbN.con{box-shadow:0 0 0 3px #5fd3ff,0 0 40px rgba(95,211,255,.6)}
.wbN.bad{border-color:#ff6b6b}
.wbN b{display:block;font-size:14px;font-weight:700;letter-spacing:.01em}
.wbN small{display:block;font-size:11.5px;color:rgba(255,255,255,.7);margin-top:2px}
.wbN em{display:inline-block;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#1a2350;background:linear-gradient(120deg,#f4d58d,#c8a75e);padding:3px 8px;border-radius:999px;margin-top:6px}
.wbN .pt{position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#0b1028;border:2px solid #e7c472;box-shadow:0 0 10px rgba(231,196,114,.8)}
.wbN .pt.l{left:-7px}.wbN .pt.r{right:-7px}
.wbN.mc{width:170px;height:178px;padding:8px 10px 10px;text-align:center}
.wbN.mc .im{height:104px;margin:0 -2px 6px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,.75) 60%,rgba(255,255,255,.2) 100%)}
.wbN.mc img{max-width:92%;max-height:96px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));pointer-events:none}
.wbN.mc b{font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbN.st{width:150px;height:64px;padding:10px 14px 10px 46px;border-radius:999px;background:linear-gradient(120deg,#0f8a5f,#2fbf86);border-color:rgba(255,255,255,.3)}
.wbN.st .gl{position:absolute;left:10px;top:14px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:12px}
.wbN.pal,.wbN.cl{width:170px;height:110px;padding:12px 14px;text-align:center}
.wbN.pal{background:linear-gradient(150deg,rgba(247,161,44,.35),rgba(247,161,44,.08));border-color:rgba(247,161,44,.6)}
.wbN.pal .gl{font-size:26px;display:block}
.wbN.cl{background:linear-gradient(150deg,rgba(95,211,255,.32),rgba(95,211,255,.06));border-color:rgba(95,211,255,.6)}
.wbN.cl .gl{color:#5fd3ff;display:block}
.wbN.sw{width:170px;height:92px;padding:12px 14px 10px 54px;background:linear-gradient(150deg,rgba(95,211,255,.22),rgba(255,255,255,.04));border-color:rgba(95,211,255,.45)}
.wbN.sw .gl{position:absolute;left:12px;top:16px;width:34px;height:34px;border-radius:10px;background:rgba(95,211,255,.18);color:#5fd3ff;display:flex;align-items:center;justify-content:center}
.wbN.sw b{font-size:13px;line-height:1.2}
.wbN.sw em{background:linear-gradient(120deg,#9be7ff,#5fd3ff)}
.wbEmpty{position:absolute;left:520px;top:440px;color:rgba(255,255,255,.55);font:600 22px/1.4 Inter,system-ui,sans-serif;text-align:center}
.wbEmpty small{font-size:15px;font-weight:500}
.wbBar{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 10px;background:linear-gradient(180deg,#121a3f,#0e1534);border-bottom:1px solid rgba(231,196,114,.22)}
.wbBar .wbHud,.wbBar .wbTools{position:static;background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0}
.wbBar .wbHud{flex:1;min-width:0}.wbBar .wbHud small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbBar .wbTools{gap:4px}
.wbBar .wbTools button{min-width:34px;height:34px;padding:0 6px;font-size:15px}
.wbCol{position:absolute;top:0;bottom:0}
.wbCol span{position:absolute;left:18px;top:8px;font:700 12px/1 Inter,system-ui,sans-serif;letter-spacing:.22em;color:rgba(231,196,114,.55)}
.wbCol.ln{left:0;width:250px;background:linear-gradient(90deg,rgba(231,196,114,.05),transparent)}
.wbCol.sw{left:270px;right:0;border-left:1px dashed rgba(95,211,255,.2);background:linear-gradient(90deg,rgba(95,211,255,.05),transparent)}
.wbCol.sw span{color:rgba(95,211,255,.6)}
.wb.vert .wbLane{display:none}
.wbN .pt.t{left:50%;top:-7px;margin:0 0 0 -6px}.wbN .pt.b{left:50%;top:auto;bottom:-7px;margin:0 0 0 -6px}
.wb.vert .wbN .pt.l,.wb.vert .wbN .pt.r{display:none}
.wb:not(.vert) .wbN .pt.t,.wb:not(.vert) .wbN .pt.b{display:none}
.ttHalf.erp{border-top-color:#2f78c4}
.wbN.erp{width:170px;height:110px;padding:12px 14px;text-align:center;background:linear-gradient(150deg,rgba(47,120,196,.45),rgba(47,120,196,.1));border-color:rgba(120,180,255,.6)}

<script>
(function(){
  const intro = document.getElementById('intro');
  if(!intro) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ready = false, left = false;

  /* gold dust: drifts in toward the logo, bursts when it locks together */
  const cv = document.getElementById('introFx'), cx = cv.getContext('2d');
  let W, H, dpr = Math.min(2, window.devicePixelRatio || 1), parts = [], run = true;
  function size(){ W = cv.clientWidth; H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0); }
  size(); addEventListener('resize', size);
  const rnd = (a,b) => a + Math.random()*(b-a);
  for(let i=0;i<70;i++) parts.push({x:rnd(0,W), y:rnd(0,H), r:rnd(.4,1.6), a:rnd(.15,.6), vx:0, vy:0, mode:'in'});
  function burst(){
    const ox = W/2, oy = H*.45;
    for(let i=0;i<90;i++){ const t=rnd(0,Math.PI*2), s=rnd(1.5,6.5);
      parts.push({x:ox+rnd(-60,60), y:oy+rnd(-30,30), r:rnd(.6,2.2), a:1, vx:Math.cos(t)*s, vy:Math.sin(t)*s, mode:'burst'}); }
  }
  function tick(){
    if(!run) return;
    cx.clearRect(0,0,W,H);
    const ox = W/2, oy = H*.45;
    parts.forEach(p => {
      if(p.mode==='in'){ p.vx += (ox-p.x)*0.00025; p.vy += (oy-p.y)*0.00025; p.vx*=.97; p.vy*=.97; if(ready){p.mode='float';} }
      else if(p.mode==='float'){ p.vx = p.vx*.98 + rnd(-.03,.03); p.vy = p.vy*.98 - 0.01; }
      else { p.vx*=.95; p.vy*=.95; p.a*=.975; }
      p.x+=p.vx; p.y+=p.vy;
      cx.globalAlpha = p.a; cx.fillStyle = '#e2c789';
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill();
    });
    parts = parts.filter(p => p.a > .03 && p.x>-20 && p.x<W+20 && p.y>-20 && p.y<H+20);
    requestAnimationFrame(tick);
  }
  if(!reduce) tick();

  function finish(){
    if(ready) return; ready = true;
    intro.classList.add('done','lit'); if(!reduce) burst();
  }
  // start the assembly
  requestAnimationFrame(() => intro.classList.add('go'));
  setTimeout(finish, reduce ? 50 : 2950);

  function enter(){
    if(!ready){ finish(); return; }          // first tap during the animation skips to the finished logo
    if(left) return; left = true;
    intro.classList.add('leave','gone');
    try{ window.NovaApp && NovaApp.introDone(); }catch(e){}
    setTimeout(() => { run = false; intro.remove(); }, 1000);
  }
  intro.addEventListener('click', enter);
  intro.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' ') { e.preventDefault(); enter(); } });
})();
</script>

const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const evD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const evToday = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const evDays = e => Math.round((evD(e.start) - evToday()) / 864e5);
const evLive = e => evToday() >= evD(e.start) && evToday() <= evD(e.end);
function evRange(e){ const a = evD(e.start), b = evD(e.end), M = x => x.toLocaleString('en', {month:'short'});
  return a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${M(b)} ${b.getFullYear()}` : `${a.getDate()} ${M(a)} – ${b.getDate()} ${M(b)} ${b.getFullYear()}`; }
function evLists(){ const all = D.events || [];
  const up = all.filter(e => evD(e.end) >= evToday()).sort((a,b) => evD(a.start) - evD(b.start));
  const past = all.filter(e => evD(e.end) < evToday()).sort((a,b) => evD(b.start) - evD(a.start));
  return { up, past }; }
function evTile(){
  const { up, past } = evLists(); const e = up[0] || past[0]; if(!e) return '';
  const live = evLive(e), n = evDays(e), d = evD(e.start);
  return `<a class="evCta" href="#events" aria-label="Events">

    <span class="evTxt"><small><i></i>${live ? 'Happening now' : up.length ? 'Events · next up' : 'Events'}</small><b>${esc(e.t)}</b><span>${esc(evRange(e))} · ${esc(e.city)}</span></span>
    ${!live && up.length && n >= 0 ? `<span class="evCd"><b>${n}</b><span>${n === 1 ? 'day' : 'days'}</span></span>` : `<span class="chev" style="color:#fff">${svg('chev')}</span>`}
  </a>`;
}
function evGcal(e){ const f = s => s.replace(/-/g,''), end = evD(e.end); end.setDate(end.getDate() + 1);
  const p = x => String(x).padStart(2,'0'), en = `${end.getFullYear()}${p(end.getMonth()+1)}${p(end.getDate())}`;
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(e.t) + '&dates=' + f(e.start) + '/' + en + '&location=' + encodeURIComponent(e.venue + ', ' + e.city) + '&details=' + encodeURIComponent(e.summary + '\n\nNOVA Engineering · ' + C.mobile); }
const evMap = e => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.venue + ', ' + e.city);
const evWa = e => 'https://wa.me/' + C.mobile.replace('+','') + '?text=' + encodeURIComponent(`Hello NOVA, I'd like to book a meeting with your team at ${e.t} (${evRange(e)}).`);

function shrink(file){  // resize photos so the email stays small
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
      const k = Math.min(1, 1600 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res({ name: file.name || 'photo.jpg', data: c.toDataURL('image/jpeg', .82) });
    }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}

COMPANY

function bindUrsEdit(){
  const root = $('#ursEd'); if(!root) return;
  const id = root.dataset.id;
  const u = ursGet(id);
  const save = () => ursSave(u);
  const counts = () => {
    ursSections(u).forEach(({s, items}) => {
      const on = items.filter(it => itemState(u,it).on).length;
      const el = root.querySelector(`[data-cnt="${s.id}"]`); if(el) el.textContent = `${on} of ${items.length} requirements included`;
    });
    const allFields = ['project','company','docNo','author','approver'].map(k => u.info[k]).concat(U.sections.flatMap(s => s.fields.map(f => u.fields[f[0]])));
    const pct = Math.round(100 * allFields.filter(Boolean).length / allFields.length);
    $('#uProg').style.width = pct + '%'; $('#uProgT').textContent = `${pct}% of key information filled in · saved automatically`;
  };
  counts();
  root.addEventListener('input', e => {
    const t = e.target;
    if(t.dataset.info){ u.info[t.dataset.info] = t.value; if(t.dataset.info==='docNo') setBar(t.value || 'URS'); }
    else if(t.dataset.field){ u.fields[t.dataset.field] = t.value; }
    else if(t.classList.contains('iv')){ const st = (u.items[t.dataset.item] = u.items[t.dataset.item] || {}); st.vals = st.vals || []; st.vals[+t.dataset.vi] = t.value; t.size = Math.max(4, Math.min(22, t.value.length+1)); }
    else return;
    save(); counts();
  });
  root.addEventListener('change', e => { if(e.target.dataset.field){ u.fields[e.target.dataset.field] = e.target.value; save(); counts(); } });
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if(b){
      const row = b.closest('.ri'), iid = row.dataset.id;
      const it = ursSections(u).flatMap(x => x.items).find(x => x[0] === iid);
      const st = (u.items[iid] = Object.assign({}, u.items[iid] || {}));
      const cur = itemState(u, it);
      if(b.dataset.act === 'tog'){ st.on = !cur.on; u.items[iid] = st; row.classList.toggle('off', !st.on); }
      if(b.dataset.act === 'pr'){ const nx = {M:'D', D:'O', O:'M'}[cur.pr]; st.pr = nx; u.items[iid] = st; b.className = 'prc ' + PRC[nx]; b.textContent = U.priorities[nx].label; }
      if(b.dataset.act === 'del'){ u.custom = u.custom.filter(c => c.id !== iid); delete u.items[iid]; row.remove(); }
      save(); counts(); return;
    }
    const add = e.target.closest('[data-addbtn]');
    if(add){
      const sec = add.dataset.addbtn, ta = root.querySelector(`[data-add="${sec}"]`), txt = ta.value.trim();
      if(!txt) { ta.focus(); return; }
      const c = { id: 'c' + Date.now().toString(36), sec, text: txt.replace(/[\[\]]/g,''), pr: 'M', ver: 'OQ' };
      u.custom.push(c); save();
      const it = [c.id, c.text, c.pr, c.ver, true];
      root.querySelector(`[data-sec="${sec}"] .rlist`).insertAdjacentHTML('beforeend', `<div class="ri" data-id="${c.id}"><button type="button" class="rchk" data-act="tog">${svg('check',3)}</button><div class="rtxt">${esc(c.text)}<div class="rmeta"><button type="button" class="prc pm" data-act="pr">Mandatory</button><span class="vtag">OQ</span><button type="button" class="rdel" data-act="del">Remove</button></div></div></div>`);
      ta.value = ''; counts();
    }
  });
  let delArmed = false;
  $('#uDel').addEventListener('click', e => {
    if(!delArmed){ delArmed = true; e.target.textContent = 'Tap again to delete permanently'; setTimeout(() => { delArmed = false; e.target.textContent = 'Delete this URS'; }, 4000); return; }
    store.set('nova.urs', ursAll().filter(x => x.id !== id)); location.hash = 'urs';
  });
}

  <tr><td>Reviewed by</td><td>${esc(I.reviewer||'')}</td><td></td><td></td></tr>
  <tr><td>Approved by (QA)</td><td>${esc(I.approver||'')}</td><td></td><td></td></tr></tbody></table>

  <h2>Purpose and use of this document</h2>

function bindUrsDoc(){

let Q = null, Qfiles = [];
const QSTEPS = ['Application','Advisor','Technical basis','Your details','Review'];

function qLoad(){ if(!Q) Q = store.get('nova.quote', null) || { app:'', scale:'', haz:'', type:'', time:'', pick:[], nova:true, basis:'', ursId:'', tech:{}, c:{} }; Q.sp = Q.sp || {}; return Q; }
function qSave(){ store.set('nova.quote', Q); }
function qApp(){ return APPS.find(a => a.id === Q.app); }
function qRecs(){
  const a = qApp(); if(!a) return [];
  const sc = spGet('scope') || [], fromScope = qProf().scope.filter(o => sc.includes(o[0])).flatMap(o => o[1]);
  let ids = fromScope.length ? fromScope : a.partners.slice();
  Q.haz = spGet('haz') || '';
  if(/Potent|Cytotoxic/.test(Q.haz)) ids = ids.concat(['tema','andock','abc']);
  if(/Flammable|ATEX/.test(Q.haz)) ids = ids.concat(['cora']);
  if(Q.scale === 'Complete turnkey line') ids = ids.concat(['techniconsult']);
  return [...new Set(ids)].map(pById).filter(Boolean);
}
function qBasisOk(){
  if(Q.basis === 'upload') return Qfiles.length > 0;
  if(Q.basis === 'urs') return !!(Q.ursId && ursGet(Q.ursId));
  if(Q.basis === 'tech') return qTechFields().filter(f => f[3]).every(f => (Q.tech[f[0]]||'').trim());
  return false;
}
function qAdvOk(){ const P = qProf(); if(!P) return false;
  if(!(spGet('scope') || []).length) return false;
  if(!P.common.every(k => Q[k])) return false;
  return P.qs.every(q => { const v = spGet(q[0]); return q[3] ? (v || []).length : !!v; });
}
function qContactOk(){ const c = Q.c; return c.name && c.company && c.phone && c.email && /^\S+@\S+\.\S+$/.test(c.email); }
function qStepOk(n){ return n===1 ? !!Q.app : n===2 ? qAdvOk() : n===3 ? qBasisOk() : n===4 ? !!qContactOk() : true; }

/* entry: #quote, #quote-p-<partner>, #quote-urs-<id>, #quote-s<N>, #quote-done */
function quote(a){
  qLoad();
  if(a.startsWith('p-')){ const [pid, ref] = a.slice(2).split('~'), p = pById(pid); if(p){ Q.prod = ''; if(ref){ const [gi, ii] = ref.split('.'), g = catOf(pid)[+gi], x = g && g[1][+ii]; if(x) Q.prod = p.name + ' – ' + x[0]; } const ap = APPS.find(x => x.partners.includes(p.id)); if(ap){ Q.app = ap.id; Q.sp = Q.sp || {}; const sc = QP[ap.id].scope.filter(z => z[1].includes(p.id)).map(z => z[0]); if(sc.length) Q.sp[ap.id + '.scope'] = sc; } Q.pick = [p.id]; Q.nova = false; } qSave(); location.replace('#quote-s1'); return ''; }
  if(a.startsWith('urs-')){ const u = ursGet(a.slice(4)); if(u){ Q.basis = 'urs'; Q.ursId = u.id; const ap = APPS.find(x => x.urs === u.machine); if(ap && !Q.app) Q.app = ap.id; if(!Q.c.company) Q.c.company = u.info.company; if(!Q.c.name) Q.c.name = u.info.author; } qSave(); location.replace('#quote-s' + (!qStepOk(1) ? 1 : !qStepOk(2) ? 2 : 3)); return ''; }
  if(a === 'done') return qDone();
  let n = +(a.replace('s','')) || 1;
  for(let i = 1; i < n; i++) if(!qStepOk(i)){ location.replace('#quote-s' + i); return ''; }   // can't skip ahead of an incomplete step
  return qShell(n);
}
function qShell(n){

    <div class="qrail">${QSTEPS.map((s,i) => `<span class="${i<n?'on':''}"></span>`).join('')}</div>
    <div class="qbody">${body}</div>
    <div class="qnav">

      ${n<5 ? `<button class="qbtn gold" id="qNext" ${qStepOk(n)?'':'disabled'}>Continue ${svg('chev',2.4)}</button>`
            : `<button class="qbtn gold" id="qSubmit">Submit request ${svg('send',2.2)}</button>`}

}

function bindQuote(){
  const root = $('#qx'); if(!root || root.classList.contains('qdone')) return;
  const n = +root.dataset.step;
  const refresh = () => { const b = $('#qNext'); if(b) b.disabled = !qStepOk(n); };
  root.addEventListener('click', e => {
    const t = e.target;
    const app = t.closest('[data-app]');
    if(app){ Q.app = app.dataset.app; Q.pick = Q.pick.filter(id => qApp().partners.includes(id)); qSave();
      root.querySelectorAll('.qapp').forEach(x => x.classList.toggle('on', x===app)); refresh(); return; }
    const chip = t.closest('.qchip');
    if(chip){ const box = chip.parentElement; if(!box.dataset.multi) box.querySelectorAll('.qchip').forEach(x => x.classList.toggle('on', x===chip));
      if(box.dataset.key){ Q[box.dataset.key] = chip.dataset.v;
        if(box.dataset.key==='scale'){ qSave(); const sc = root.querySelector('.qbody').scrollTop; root.outerHTML = qShell(2); bindQuote(); $('#qx .qbody').scrollTop = sc; return; } }
      if(box.dataset.skey){ const k = spKey(box.dataset.skey);
        if(box.dataset.multi){ let v = Q.sp[k] || []; const x = chip.dataset.v;
          v = v.includes(x) ? v.filter(y => y !== x) : (x === NS ? [NS] : v.filter(y => y !== NS).concat(x));
          Q.sp[k] = v; box.querySelectorAll('.qchip').forEach(b => b.classList.toggle('on', v.includes(b.dataset.v))); }
        else Q.sp[k] = chip.dataset.v;
        if(box.dataset.skey === 'scope' || box.dataset.skey === 'haz'){ const pids = qRecs().map(p => p.id); Q.pick = Q.pick.filter(id => pids.includes(id)); qSave(); const sc = root.querySelector('.qbody').scrollTop; root.outerHTML = qShell(2); bindQuote(); $('#qx .qbody').scrollTop = sc; return; } }
      if(box.dataset.ckey) Q.c[box.dataset.ckey] = chip.dataset.v;
      qSave(); refresh(); return; }
    const p = t.closest('[data-p]');
    if(p){ const id = p.dataset.p; Q.pick = Q.pick.includes(id) ? Q.pick.filter(x => x!==id) : Q.pick.concat(id); p.classList.toggle('on'); qSave(); return; }
    const ob = t.closest('[data-basis-btn]');
    if(ob){ Q.basis = ob.dataset.basisBtn; qSave(); root.querySelectorAll('.qopt').forEach(x => x.classList.toggle('on', x.dataset.basis===Q.basis)); refresh(); return; }
    const ui = t.closest('[data-urs]');
    if(ui){ Q.ursId = ui.dataset.urs; Q.basis = 'urs'; qSave(); root.querySelectorAll('.qursi').forEach(x => x.classList.toggle('on', x===ui)); refresh(); return; }
    if(t.closest('#qBuild')){ Q.basis = 'urs'; qSave(); store.set('nova.quoteReturn', true); location.hash = 'urs-create-' + (qApp() ? qApp().urs : 'generic'); return; }
    const rm = t.closest('[data-rmf]');
    if(rm){ Qfiles.splice(+rm.dataset.rmf, 1); qDrawFiles(); refresh(); return; }
    if(t.closest('#qNext')){ if(qStepOk(n)) location.hash = 'quote-s' + (n+1); return; }
    if(t.closest('#qSubmit')){ qSubmit(); return; }
  });
  root.addEventListener('change', e => {
    if(e.target.id === 'qNova'){ Q.nova = e.target.checked; e.target.closest('.qnova').classList.toggle('on', Q.nova); qSave(); }
    if(e.target.id === 'qFile'){ qAddFiles([...e.target.files]).then(() => { e.target.value = ''; refresh(); }); }
  });
  root.addEventListener('input', e => {
    const t = e.target;
    if(t.dataset.tech){ Q.tech[t.dataset.tech] = t.value; t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
    if(t.dataset.c){ Q.c[t.dataset.c] = t.value; }
    qSave(); refresh();
  });
  root.querySelectorAll('textarea.qin').forEach(t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; });
  if(n === 3) qDrawFiles();
}
async function qAddFiles(files){
  for(const f of files){
    if(Qfiles.length >= 5) break;
    const total = Qfiles.reduce((s,x) => s + x.size, 0);
    if(total + f.size > 12*1024*1024){ alertBox('Files are too large. Keep the total under 12 MB, or send large files by email.'); break; }
    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
    Qfiles.push({ name: f.name || 'document', size: f.size, mime: f.type || 'application/octet-stream', data });
  }
  if(Qfiles.length){ Q.basis = 'upload'; qSave(); }
  qDrawFiles();
}
function alertBox(msg){ const h = $('#qFiles'); if(h) h.insertAdjacentHTML('afterend', `<p class="qerr">${esc(msg)}</p>`); }
function qDrawFiles(){
  const h = $('#qFiles'); if(!h) return;
  const kb = s => s > 1048576 ? (s/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(s/1024)) + ' KB';
  h.innerHTML = Qfiles.map((f,i) => `<div class="qf"><span class="qfi">${esc((f.name.split('.').pop()||'').slice(0,4).toUpperCase())}</span><div><b>${esc(f.name)}</b><small>${kb(f.size)}</small></div><button type="button" data-rmf="${i}" aria-label="Remove">${svg('x',2.2)}</button></div>`).join('');
}

  if(needCloud && !has('@cloud')) L.nodes.push({ id:'cloud', k:'@cloud', lane:'sw', x:0, y:90 });

function ttMain(L){ return L.nodes.filter(n => !ttIsSw(n)).sort((a, b) => (TT_ORDER.indexOf(a.lane) - TT_ORDER.indexOf(b.lane)) || (a.x - b.x)); }

function ttArrange(L){

  if(ttVert()){
    let y = 30; ttMain(L).forEach(n => { n.x = n.k === '@start' ? 50 : 40; n.y = y; y += n.k === '@start' ? 110 : 230; });
    const u = L.nodes.find(n => n.lane === 'unit'); let sy = u ? u.y + 40 : 140;

function ttNodeHtml(L, n){

function ttLinksSvg(L){

    const ac = [a.x + W(a)/2, a.y + H(a)/2], bc = [b.x + W(b)/2, b.y + H(b)/2], dx = bc[0] - ac[0], dy = bc[1] - ac[1];
    let d;
    if(Math.abs(dy) > Math.abs(dx)){ const down = dy > 0; const x1 = ac[0], y1 = down ? a.y + H(a) : a.y, x2 = bc[0], y2 = down ? b.y : b.y + H(b), k = Math.max(40, Math.abs(y2 - y1) / 2) * (down ? 1 : -1);
      d = `M${x1},${y1} C${x1},${y1 + k} ${x2},${y2 - k} ${x2},${y2}`; }
    else { const right = dx > 0; const x1 = right ? a.x + W(a) : a.x, y1 = ac[1], x2 = right ? b.x : b.x + W(b), y2 = bc[1], k = Math.max(40, Math.abs(x2 - x1) / 2) * (right ? 1 : -1);

    <marker id="arD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fd3ff"/></marker></defs>${paths}</svg>`;
}
const ttZoom = () => TT.zoom || (ttVert() ? Math.min(.72, Math.max(.4, (Math.min(window.innerWidth, 900) - 40) / 520)) : .62);
function ttBoard(){
  const L = ttL(), s = ttScore(); ttDims(L); const z = ttZoom();
  const sel = L.nodes.find(n => n.id === TT.sel);

    const lanes = m ? m[3].filter(l => ttLaneOk(L, l)) : [];
    insp = `<div class="wbI"><div class="t"><b>${esc(m ? m[2] : sel.k === '@start' ? 'Product in' : sel.k === '@pallet' ? 'Pallet (manual)' : sel.k === '@erp' ? 'ERP / SAP' : 'Authority')}</b>

function ttAddNode(k, x, y, hint){

  const lane = (hint && lanes.includes(hint)) ? hint : (lanes.find(l => !covered.has(l)) || lanes[0]);

  const n = { id: 'n' + Math.random().toString(36).slice(2, 8), k, lane, x: 0, y: 0 };
  if(x == null && ttVert()){ L.nodes.push(n); L.arranged = false; ttArrange(L); L.nodes.pop(); }
  else if(x == null){ if(lane === 'sw'){ const sw = L.nodes.filter(q => q.lane === 'sw' && q.k !== '@cloud'); n.x = 250 + sw.length * 210; n.y = 90; }
    else { const prev = ttMain(L).filter(q => TT_ORDER.indexOf(q.lane) <= TT_ORDER.indexOf(lane)).pop(); n.x = prev ? prev.x + (prev.k === '@start' ? 170 : 210) : 220; n.y = 380;
      L.nodes.filter(q => !ttIsSw(q) && TT_ORDER.indexOf(q.lane) > TT_ORDER.indexOf(lane)).forEach(q => q.x += 210); } }
  else { n.x = Math.max(0, Math.round((x - 85) / 10) * 10); n.y = Math.max(0, Math.round((y - 80) / 10) * 10); }
  L.nodes.push(n);
  if(x == null && ttVert()) ttArrange(L);

  ttFlow(L); TT.sel = n.id; ttSave();
  const after = ttScore();
  ttToast('+10 XP · ' + m[2] + ' → ' + ttLaneT(lane) + (after.req.length ? ' · ' + after.pct + '%' : ''));

function bindBoard(rerender){

  $('#wbOr').addEventListener('click', () => { TT.orient = ttVert() ? 'h' : 'v'; TT.zoom = null; TT.scroll = [0, 0]; TT.lines.forEach(x => { ttArrange(x); ttFlow(x); }); ttSave(); rerender(); });

    const k = t.dataset.mod, sx = e.clientX, sy = e.clientY; let ghost = null;

    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  }));
}

/* ---------- router ---------- */
function route(){
  const h = (location.hash || '#home').slice(1), cut = h.indexOf('-');
  const r = cut < 0 ? h : h.slice(0, cut), a = cut < 0 ? '' : h.slice(cut + 1);
  let html, after;
  if(r === 'partners'){ html = partners(a && catById(a) ? a : ''); after = () => bindPartners(a && catById(a) ? a : ''); }
  else if(r === 'p'){ html = partner(a); }
  else if(r === 'prod'){ html = product(a); }
  else if(r === 'events'){ html = events(); }
  else if(r === 'event'){ html = eventItem(a); }
  else if(r === 'company'){ html = company(a); }
  else if(r === 'library'){ html = library(); after = bindLibrary; }
  else if(r === 'lib'){ html = libItem(a); }
  else if(r === 'urs'){
    const [k, ...rest] = a.split('-'), v = rest.join('-');
    if(k === 'new'){ html = ursNew(); }
    else if(k === 'create'){ html = ursCreate(v); }
    else if(k === 'edit'){ html = ursEdit(v); after = bindUrsEdit; }
    else if(k === 'doc'){ html = ursDoc(v); after = bindUrsDoc; }
    else if(k === 'guide'){ html = ursGuide(v); }
    else { html = ursHub(); }
  }
  else if(r === 'support'){ html = support(a); after = bindSupport; }
  else if(r === 'ticket'){ html = ticket(a); }
  else if(r === 'contact'){ html = contact(); }
  else if(r === 'quote'){ html = quote(a); after = bindQuote; }
  else if(r === 'tt'){ html = tt(a); after = bindTT; }
  else { html = home(); after = bindHome; }
  const app = $('#app');
  app.innerHTML = `<div class="view">${html}</div>`;
  if(!(r === 'company' && a)) window.scrollTo(0, 0);
  after && after();
  try{ if(!document.getElementById('intro') && window.NovaApp && NovaApp.setBars) NovaApp.setBars(r === 'quote'); }catch(e){}
}
window.addEventListener('hashchange', route);
route();
